# ===========================================================================
# Pre-commit configuration — cloud-gov/aws-broker
# ===========================================================================
# Consumes the internal cloud-gov/pre-commit-templates (pinned rev). Added on the
# Oracle-19c feature branch (#519) so the scanners validate our changes.
#
# CAULKING: cloud.gov dev hosts run caulking, which sets core.hooksPath globally
# and invokes this file via `prek` automatically. Do NOT run `pre-commit install`
# (it fails with "cowardly refusing to install hooks with core.hooksPath set").
# Run manually with `pre-commit run --all-files` or `make lint` (see below).
# gitleaks is intentionally absent — caulking runs it globally.
#
# SCOPE DECISION (see the epic PR description): aws-broker is a large inherited
# repo with pre-existing lint/SAST debt and NO prior lint gate (CI was only
# `go test ./...`). Whole-repo golangci-lint reports ~53 inherited findings and
# even --new-from-merge-base mis-attributes line-shifted pre-existing findings to
# this branch. To get honest signal on OUR Oracle changes, golangci-lint is gated
# to the Go files this branch authored; hygiene + fmt/vet + shell run normally.
# A tracked follow-up burns down inherited debt and widens the gate to ./... .
#
# Setup on a cloud.gov dev host:
#   brew bundle --file=pre-commit-templates/Brewfile   # or: brew install golangci-lint hadolint shellcheck shfmt yamllint
#   go install github.com/securego/gosec/v2/cmd/gosec@latest
#   go install golang.org/x/vuln/cmd/govulncheck@latest
# ===========================================================================

repos:
  - repo: https://github.com/cloud-gov/pre-commit-templates
    rev: v0.5.3
    hooks:
      # --- HYGIENE (all repos) — NIST SA-15 / SSDF PO.3 ---
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # exclude spruce-templated catalog + go-templated caddy files that are not
        # plain YAML (they contain (( grab ... )) / {{ ... }} operators).
        exclude: '^(catalog-template\.yml)$'
      - id: check-json

      # --- LINTING (shell) — NIST SA-11 / SSDF PW.7 ---
      # aws-broker has many shell scripts under ci/.
      - id: shellcheck
      - id: shfmt-check

      # --- COMPLIANCE ---
      - id: check-gsa-email

  # ---------------------------------------------------------------------------
  # Go linters + SAST, scoped to NEW issues on this branch (see SCOPE DECISION).
  # Kept as local hooks so we control the exact invocation (the template's
  # golangci-lint/gosec/govulncheck run whole-repo, which would flag inherited
  # debt). These require golangci-lint, gosec, govulncheck on PATH.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: go-fmt-changed
        name: gofmt (changed Go files)
        description: Formats Go files; only fails on files this branch touched.
        entry: gofmt -l
        language: system
        types: [go]
        # pass_filenames: staged changed files only

      - id: go-vet
        name: go vet
        description: Reports suspicious constructs (whole module; near-zero FPs).
        entry: bash -c 'go vet ./... 2>&1'
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint-oracle
        name: golangci-lint (Oracle-19c changes)
        description: >-
          Full linter suite gated to findings this branch introduced, attributed
          by git blame provenance (scripts/lint-oracle-go.sh) — covers every
          Oracle file we authored OR modified (broker/validate/credentials/…),
          not just new files. Inherited debt (~53 pre-existing findings, no prior
          lint gate) is excluded by authorship, not a filename allowlist. Fails
          closed if golangci-lint itself errors. A tracked follow-up widens to
          whole-repo after debt burn-down.
        entry: bash scripts/lint-oracle-go.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
