# Fidelity Oracle 19c EE for a periodic hardening parity pass.
# NOTE: no public 19c image exists — build it once from oracle/docker-images
# (LINUX.ARM64_1919000_db_home.zip, `buildContainerImage.sh -v 19.3.0 -e`) and
# tag it oracle/database:19.3.0-ee. DEVELOPMENT SIGNAL ONLY.
services:
  oracle19c:
    image: oracle/database:19.3.0-ee
    container_name: cg-oracle-19c-ee
    ports:
      # Bind to loopback only — a local dev DB with a known password must not be
      # reachable from the LAN/VPN. Do NOT change to "1522:1521" (0.0.0.0).
      - "127.0.0.1:1522:1521"
    environment:
      ORACLE_PWD: "devpw_ChangeMe1"
      ORACLE_SID: "ORCLCDB"
      ORACLE_PDB: "ORCLPDB1"
    volumes:
      - ./init:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/devpw_ChangeMe1@//localhost:1521/ORCLCDB", "as", "sysdba", "@/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 40
