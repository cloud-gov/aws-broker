# Oracle Database 19c — default CloudWatch log exports (epic #519, WS7 #527).
#
# RDS Oracle supports these CloudWatch Logs export types: alert, audit, listener,
# trace, oemagent (per aws-sdk-go-v2 CreateDBInstance docs). We enable the
# audit/security-relevant set by default so the STIG posture includes log capture
# and the overlay can see the exports via the validation contract (#530).
#
# VERIFY on the live RDS Oracle 19c engine/GovCloud before deploy (WS15): export
# support can vary by engine/version/region. Unsupported exports are surfaced with
# a rationale, never silently dropped.

# Enabled by default for the oracle-19c-dev plan.
default_exports:
  - alert      # database alert log (errors, startup/shutdown)
  - audit      # unified/standard audit records (SRG-APP audit generation)
  - listener   # listener log (connection attempts)

# Full set RDS Oracle can export (informational; not all enabled by default).
# 'trace' is high-volume and 'oemagent' requires OEM — both opt-in, not default.
supported:
  - alert
  - audit
  - listener
  - trace
  - oemagent
